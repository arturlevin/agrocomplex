services:
  db:
    image: postgres:16-alpine
    container_name: agro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agro_user
      POSTGRES_PASSWORD: agro_pass
      POSTGRES_DB: agro_db
    volumes:
      - agro_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro_user -d agro_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: agro_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://agro_user:agro_pass@db:5432/agro_db
      SECRET_KEY: change-this-secret-key-in-production-please
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  agro_pg_data:

# Фронтенд сюда намеренно не включён — его запускаем отдельно через
# `npm run dev` в папке frontend (см. README). Так удобнее для разработки:
# hot-reload работает быстрее, и сборка не зависит от npm-реестра в Docker.
# Если понадобится собрать фронтенд в контейнере (например, для прод-сборки),
# верни блок сервиса frontend с build: ./frontend и портом "5173:80".
